<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block titre_page %}TaskLab TWIN2{% endblock %}</title>
<style>
body{font-family:system-ui;max-width:850px;margin:35px auto;padding:0 16px;color:#172033}
nav{display:flex;gap:18px;padding:18px;background:#eef2ff;border-radius:12px}
a{color:#254bc0}
ul{padding:0;list-style:none}
li{margin:14px 0;padding:12px;background:#f8fafc;border-radius:8px}
button{cursor:pointer}
input,textarea,select{padding:8px;margin:6px}
.badge{display:inline-block;padding:2px 10px;border-radius:999px;font-size:.85em;font-weight:600}
.statut-A_FAIRE{background:#e2e8f0;color:#1e293b}
.statut-EN_COURS{background:#fef3c7;color:#92400e}
.statut-TERMINEE{background:#dcfce7;color:#166534}
.priorite{display:inline-block;padding:2px 10px;border-radius:8px;font-size:.85em;background:#eef2ff;color:#254bc0}
.errorlist{color:#b91c1c;list-style:none;padding:0;margin:4px 0}
.helptext{display:block;color:#475569;font-size:.85em}
.retour{display:inline-block;margin-top:16px}
</style>
</head>
<body>
<nav>
  <a href="{% url 'liste_taches' %}">TaskLab</a>
  <a href="{% url 'creer_tache' %}">Ajouter une tâche</a>
</nav>
<main>{% block contenu %}{% endblock %}</main>
</body>
</html>
